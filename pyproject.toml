[project]
name = "retrieve-then-match"
version = "0.1.0"
description = "Two-stage text entity matching: BM25 + dense hybrid retrieval, cross-encoder matching, and a reproducible evaluation harness."
readme = "README.md"
authors = [{ name = "Zane Neave", email = "zane.n.neave@gmail.com" }]
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["entity-matching", "retrieval", "bm25", "dense-retrieval", "cross-encoder", "evaluation"]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "bm25s>=0.2",
    "sentence-transformers>=3.0",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.7",
]

[project.scripts]
rtm = "retrieve_then_match.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/retrieve_then_match"]

# ---------- Tooling ----------

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "SIM",      # simplify
    "RUF",      # ruff-specific
]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
